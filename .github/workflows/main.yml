name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: |
          cd "$(dirname "$(find . -name gradlew -not -path './.git/*' | head -1)")"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/NeonSnake.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NeonSnake-apk
          path: NeonSnake.apk
