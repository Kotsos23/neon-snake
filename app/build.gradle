plugins {
    id 'com.android.application'
}

android {
    namespace 'com.neonsnake.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.neonsnake.game'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // The same key signs every build, so a new APK installs over the old one
    // and the saved best score is kept.
    signingConfigs {
        shared {
            storeFile file('neonsnake.keystore')
            storePassword 'neonsnake'
            keyAlias 'neonsnake'
            keyPassword 'neonsnake'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
